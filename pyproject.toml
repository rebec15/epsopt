[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epsopt"
version = "0.1.0"
description = "Algorithms for epsilon-optimizers in convex set-valued optimization problems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "cvxpy>=1.4",
]

[project.optional-dependencies]
examples = [
    "matplotlib>=3.7",
]
polycone = [
    "pycddlib>=2.1",
]

[tool.setuptools]
packages = ["epsopt"]

[tool.setuptools.package-dir]
epsopt = "."
